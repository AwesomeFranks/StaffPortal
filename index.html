<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#105e59">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta name="apple-mobile-web-app-title" content="Awesome Franks">

  <title>Awesome Franks Staff Portal</title>

  <style>
    :root {
      background: #105e59;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #105e59;
    }

    body {
      position: fixed;
      inset: 0;
    }

    .portal-frame {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      border: 0;
      background: #105e59;
    }

    @supports (padding: env(safe-area-inset-top)) {
      body {
        padding:
          env(safe-area-inset-top)
          env(safe-area-inset-right)
          env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }

      .portal-frame {
        position: absolute;
        width: 100%;
        height: 100%;
      }
    }
  </style>
</head>

<body>
  <iframe
    class="portal-frame"
    src="
    https://script.google.com/macros/s/AKfycbx1pHZkjjiWzkwQ2QCfa6WlOEN6zLxtCj3SMZZvLaFffa-x0j-8t4RkQ3bPNiVU4WI3/exec
    "
    title="Awesome Franks Staff Portal"
    allow="fullscreen"
    allowfullscreen
  ></iframe>
</body>
</html>
