<!DOCTYPE html>
<html>
<head>
  <title>AF Staff Portal</title>
</head>
<body>
  <iframe 
    src="
    
    https://script.google.com/macros/s/AKfycbxG9o8wiRALdDmoKYLl_NOcPgAhWYZwI_gQZ7_6W7ks1h_07W336a_dycAUvK8WwlpP/exec
    
    "
    width="100%"
    height="100%"
    allowfullscreen="true"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none;">
  </iframe>

  <script>
    window.onload = function() {
      document.querySelector('iframe')
        .requestFullscreen()
        .catch((err) => {
          console.error('Error attempting to enable full-screen mode:', err.message);
        });
    };
  </script>
</body>
</html>
